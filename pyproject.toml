[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-deskter"
version = "0.1.0"
description = "Offline Desktop Voice Assistant and CustomTkinter Dashboard for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "psutil>=5.9",
    "pywin32>=306",
    "pycaw>=20240210",
    "screen-brightness-control>=0.23",
    "pynput>=1.7",
    "customtkinter>=5.2",
    "pillow>=10.0",
    "websockets>=12.0",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23"
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "onnxruntime>=1.16",
    "faster-whisper>=1.0",
    "openwakeword>=0.6.0",
    "pyttsx3>=2.90"
]
tray = [
    "pystray>=0.19.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
